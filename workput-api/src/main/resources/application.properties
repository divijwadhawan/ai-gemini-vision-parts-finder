spring.application.name=golf-parts-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
gemini.api.key=${GEMINI_API_KEY:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}

# Verify Google ID tokens sent by the iOS app as Bearer tokens.
# Set GOOGLE_CLIENT_ID to the exact OAuth client ID in the ID token's aud claim.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.resourceserver.jwt.audiences=${GOOGLE_CLIENT_ID:unconfigured}

logging.level.org.springframework.security=DEBUG

# Image upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB