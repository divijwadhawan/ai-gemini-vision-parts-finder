spring.application.name=workput-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://appleid.apple.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://appleid.apple.com/auth/keys
spring.security.oauth2.resourceserver.jwt.audiences=com.divijwadhawan.GolfParts