# -------------------------------------------------------
# Test Database
# -------------------------------------------------------
# Tests use an isolated in-memory H2 database.
# They must never connect to the production Render database.

spring.datasource.url=jdbc:h2:mem:golfparts_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create the database schema for the test run
spring.jpa.hibernate.ddl-auto=create-drop

# -------------------------------------------------------
# Authentication
# -------------------------------------------------------
# Dummy value used only while loading the Spring test context.
# MockMvc tests provide their own mock JWTs.

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.resourceserver.jwt.audiences=test-client-id

# -------------------------------------------------------
# External services
# -------------------------------------------------------
# Never use the real Gemini key during automated tests.

gemini.api.key=test-key